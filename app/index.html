      <!-- Phones lay the page out at 875px and scale it to fit natively rather
           than reflowing to their real width. Native scaling rather than CSS is
           deliberate: WebKit text autosizing boosts text inside a CSS-zoomed
           box while leaving icons and fixed boxes at their scaled size, which
           pulls the layout apart. Keep 875 in sync with the width passed to
           <ScaleFloor>, which does the same job for desktop browsers, where
           this tag is ignored. -->
      <meta name="viewport" content="width=875" />
